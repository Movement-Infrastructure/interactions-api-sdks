# openapi-generator config for the Python v1 SDK.
#
# Invoked by .github/workflows/generate-python-sdk.yml as:
#   openapi-generator generate \
#     -i openapi/v1/swagger.json \
#     -g python \
#     -o sdks/python/v1 \
#     -c sdks/python/v1/openapi-generator-config.yaml
#
# Generator pinned to v7.10.0; see the workflow for the cached jar.

# Pythonic snake_case import name.
packageName: ddx_interactions_api

# Project/PyPI name (kebab-case). The TestPyPI trusted publisher is bound to
# this, so changing it means reconfiguring on the registry side.
projectName: ddx-interactions-api

# Rewritten by the version-bump workflow on each sync PR.
packageVersion: 0.2.0

# urllib3-based synchronous client. Async (asyncio) variant is available if
# we end up needing it.
library: urllib3

# Identity fields that flow into pyproject.toml, setup.py, README, etc.
gitUserId: Movement-Infrastructure
gitRepoId: interactions-api-sdks
packageUrl: https://github.com/Movement-Infrastructure/interactions-api-sdks
# Note: `authors` comes from the spec's `info.contact` block, not from here --
# there is no generator config override for it. If that block is dropped from
# mercury.json upstream, authors falls back to "OpenAPI Generator Community"
# and the publish metadata gate fails the release. Fix it in mig-readme-docs.

globalProperties:
  apiTests: "false"
  modelTests: "false"
