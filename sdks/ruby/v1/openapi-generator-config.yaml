# openapi-generator config for the Ruby v1 SDK. Run by
# .github/workflows/generate-ruby-sdk.yml against generator 7.10.0.

# Underscore_case per RubyGems convention, matching `require "ddx_interactions_api"`.
gemName: ddx_interactions_api

# Ruby namespace for the generated classes.
moduleName: DdxInteractionsApi

# Rewritten on each sync PR by scripts/bump_version.py, which the workflow
# passes `--version-key gemVersion` because the Ruby generator uses that key
# rather than packageVersion.
gemVersion: 0.1.0

# Typhoeus, the generator's default, binds libcurl through a native extension
# and needs a compiler wherever the gem is installed. Faraday is pure Ruby.
library: faraday

# All four are required. Left unset, the generator publishes "OpenAPI-Generator"
# as the author and "unlicense" as the license.
gemAuthor: DDx API Team
gemAuthorEmail: api@demexchange.com
gemHomepage: https://github.com/Movement-Infrastructure/interactions-api-sdks
gemLicense: MIT
gemSummary: Ruby client for the DDx Interactions API
gemDescription: Ruby client for the DDx Interactions API, generated from the OpenAPI spec.

# The generator defaults to ">= 2.4", which is out of support.
gemRequiredRubyVersion: ">= 3.0"

gitUserId: Movement-Infrastructure
gitRepoId: interactions-api-sdks

globalProperties:
  apiTests: "false"
  modelTests: "false"
