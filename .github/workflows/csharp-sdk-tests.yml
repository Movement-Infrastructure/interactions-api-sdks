name: C# SDK tests

# On every PR to develop, regenerate sdks/csharp/v1/ from
# openapi/v1/swagger.json, build it, and run the smoke + happy-path suite in
# sdks/csharp/v1/test/.
#
# No `paths:` filter, deliberately: a path-filtered required check shows as
# perpetually pending on PRs that don't match it, blocking merge forever.
# Branches with no committed spec skip the heavy steps and pass.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  csharp-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Check for committed OpenAPI spec
        id: spec
        run: |
          if [ -f openapi/v1/swagger.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No openapi/v1/swagger.json on this branch; the C# SDK cannot change without a spec, so smoke tests are skipped (pass)."
          fi

      - name: Set up Java
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache openapi-generator jar
        if: steps.spec.outputs.present == 'true'
        id: cache-generator
        uses: actions/cache@v4
        with:
          path: .cache/openapi-generator-cli.jar
          key: openapi-generator-7.10.0

      - name: Download openapi-generator jar
        if: steps.spec.outputs.present == 'true' && steps.cache-generator.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -sSL \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.10.0/openapi-generator-cli-7.10.0.jar \
            -o .cache/openapi-generator-cli.jar

      - name: Generate C# SDK
        if: steps.spec.outputs.present == 'true'
        run: |
          java -jar .cache/openapi-generator-cli.jar generate \
            -i openapi/v1/swagger.json \
            -g csharp \
            -o sdks/csharp/v1 \
            -c sdks/csharp/v1/openapi-generator-config.yaml \
            -t templates/csharp

      - name: Set up Python
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The same patch generate-csharp-sdk.yml applies, because this job builds
      # what it just regenerated.
      - name: Patch generated SDK
        if: steps.spec.outputs.present == 'true'
        run: python scripts/patch_dotnet_sdk.py sdks/csharp/v1/src/Ddx.InteractionsApi/Ddx.InteractionsApi.csproj

      - name: Verify generated README
        if: steps.spec.outputs.present == 'true'
        run: python scripts/verify_readme.py sdks/csharp/v1/README.md --language csharp

      - name: Set up .NET
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The test project is deliberately not in Ddx.InteractionsApi.sln, which
      # the generator rewrites on every sync, so it is run by path. Its
      # ProjectReference builds the client as a side effect.
      - name: Build and run smoke tests
        if: steps.spec.outputs.present == 'true'
        working-directory: sdks/csharp/v1
        run: dotnet test test/Ddx.InteractionsApi.Test/Ddx.InteractionsApi.Test.csproj --nologo

      # The committed SDK can drift from the spec and the templates with
      # nothing noticing. This job has already regenerated it, so any
      # difference means the committed copy is stale. Placed last to keep a
      # drift failure from hiding the test results. Skipped when the spec
      # changed here, because generate-csharp-sdk.yml commits the regenerated
      # SDK on those PRs.
      #
      # `git status`, not `git diff`: a new model adds an untracked file, which
      # a diff does not report. Build output needs no exclusion here because
      # sdks/csharp/v1/.gitignore already covers bin/ and obj/.
      - name: Check the committed SDK is up to date
        if: steps.spec.outputs.present == 'true'
        run: |
          set -euo pipefail

          if ! git diff --quiet "origin/${{ github.base_ref }}" -- openapi/v1/swagger.json; then
            echo "::notice::Spec changed in this PR; the generate workflow commits the regenerated SDK."
            exit 0
          fi

          drift=$(git status --porcelain -- sdks/csharp/v1)

          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::sdks/csharp/v1 does not match a fresh generation. Regenerate and commit it."
            exit 1
          fi
