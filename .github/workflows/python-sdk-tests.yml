name: Python SDK tests

# On every PR to develop, regenerate sdks/python/v1/ from
# openapi/v1/swagger.json, install it, and run the smoke + happy-path suite in
# sdks/python/v1/tests/.
#
# Runs on ALL PRs (no `paths:` filter) on purpose: a required status check that
# is path-filtered will show as perpetually pending on PRs that don't match the
# filter, blocking merge forever. Running unconditionally means the check always
# reports a result. If a branch has no committed spec yet (the bootstrap window
# before the first sync PR merges), the SDK cannot be generated or affected, so
# the heavy steps are skipped and the job passes.
#
# See Plans/MIG-1918-python-sdk-smoke-tests.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Check for committed OpenAPI spec
        id: spec
        run: |
          if [ -f openapi/v1/swagger.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No openapi/v1/swagger.json on this branch; the Python SDK cannot change without a spec, so smoke tests are skipped (pass)."
          fi

      - name: Set up Java
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache openapi-generator jar
        if: steps.spec.outputs.present == 'true'
        id: cache-generator
        uses: actions/cache@v4
        with:
          path: .cache/openapi-generator-cli.jar
          key: openapi-generator-7.10.0

      - name: Download openapi-generator jar
        if: steps.spec.outputs.present == 'true' && steps.cache-generator.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -sSL \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.10.0/openapi-generator-cli-7.10.0.jar \
            -o .cache/openapi-generator-cli.jar

      - name: Generate Python SDK
        if: steps.spec.outputs.present == 'true'
        run: |
          java -jar .cache/openapi-generator-cli.jar generate \
            -i openapi/v1/swagger.json \
            -g python \
            -o sdks/python/v1 \
            -c sdks/python/v1/openapi-generator-config.yaml

      - name: Set up Python
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install generated SDK + test deps
        if: steps.spec.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ./sdks/python/v1
          pip install -r sdks/python/v1/requirements-test.txt

      - name: Run smoke tests
        if: steps.spec.outputs.present == 'true'
        run: pytest sdks/python/v1/tests -q
