name: Python SDK tests

# On every PR to develop, regenerate sdks/python/v1/ from
# openapi/v1/swagger.json, install it, and run the smoke + happy-path suite in
# sdks/python/v1/tests/.
#
# Runs on ALL PRs (no `paths:` filter) on purpose: a required status check that
# is path-filtered will show as perpetually pending on PRs that don't match the
# filter, blocking merge forever. Running unconditionally means the check always
# reports a result. If a branch has no committed spec yet (the bootstrap window
# before the first sync PR merges), the SDK cannot be generated or affected, so
# the heavy steps are skipped and the job passes.
#
# See Plans/MIG-1918-python-sdk-smoke-tests.md.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Check for committed OpenAPI spec
        id: spec
        run: |
          if [ -f openapi/v1/swagger.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No openapi/v1/swagger.json on this branch; the Python SDK cannot change without a spec, so smoke tests are skipped (pass)."
          fi

      - name: Set up Java
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache openapi-generator jar
        if: steps.spec.outputs.present == 'true'
        id: cache-generator
        uses: actions/cache@v4
        with:
          path: .cache/openapi-generator-cli.jar
          key: openapi-generator-7.10.0

      - name: Download openapi-generator jar
        if: steps.spec.outputs.present == 'true' && steps.cache-generator.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -sSL \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.10.0/openapi-generator-cli-7.10.0.jar \
            -o .cache/openapi-generator-cli.jar

      - name: Generate Python SDK
        if: steps.spec.outputs.present == 'true'
        run: |
          java -jar .cache/openapi-generator-cli.jar generate \
            -i openapi/v1/swagger.json \
            -g python \
            -o sdks/python/v1 \
            -c sdks/python/v1/openapi-generator-config.yaml \
            -t templates/python

      - name: Set up Python
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Same patch generate-python-sdk.yml applies, because this job installs
      # what it just regenerated. Without it the certifi and Requires-Python
      # fixes would go untested.
      - name: Patch generated SDK metadata
        if: steps.spec.outputs.present == 'true'
        run: python scripts/patch_python_sdk.py sdks/python/v1

      # The patch above points long_description at the README, making it the
      # PyPI project page. Checked on every PR because a dropped
      # `-t templates/python` would silently restore the built-in template.
      - name: Verify generated README
        if: steps.spec.outputs.present == 'true'
        run: python scripts/verify_readme.py sdks/python/v1/README.md

      - name: Install generated SDK + test deps
        if: steps.spec.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install ./sdks/python/v1
          pip install -r sdks/python/v1/requirements-test.txt

      - name: Run smoke tests
        if: steps.spec.outputs.present == 'true'
        run: pytest sdks/python/v1/tests -q

      # The SDK is committed, so it can drift from the spec and the templates
      # with nothing noticing. This job has already regenerated it, so a diff
      # means the committed copy is stale. Last, so a drift failure doesn't
      # hide the test results. Skipped when the spec changed here, because
      # generate-python-sdk.yml commits the regenerated SDK on those PRs.
      - name: Check the committed SDK is up to date
        if: steps.spec.outputs.present == 'true'
        run: |
          set -euo pipefail

          git fetch --depth=1 origin "${{ github.base_ref }}"

          if ! git diff --quiet FETCH_HEAD -- openapi/v1/swagger.json; then
            echo "::notice::Spec changed in this PR; the generate workflow commits the regenerated SDK."
            exit 0
          fi

          if ! git diff --exit-code -- sdks/python/v1; then
            echo "::error::sdks/python/v1 does not match a fresh generation. Regenerate and commit it."
            exit 1
          fi
