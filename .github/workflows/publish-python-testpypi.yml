name: Publish Python SDK to TestPyPI

# MIG-1927. Builds sdks/python/v1 and publishes it to TestPyPI on push to the
# `main` release branch. `develop` is where sync PRs land; promoting develop ->
# main is the deliberate act that releases.
#
# Authentication is OIDC trusted publishing — there is no token, so nothing to
# mask, leak, or rotate. This satisfies section 1 of
# docs/publish-leak-audit-checklist.md and takes most of section 2 out of scope.
#
# IMPORTANT: TestPyPI's trusted publisher is bound to this file's NAME. Renaming
# this workflow breaks publishing until the publisher config is updated to match.
#
# Build and publish are separate jobs on purpose. The build job has no
# credentials and no id-token permission; only the publish job can mint an OIDC
# token, and it does nothing but upload a prebuilt artifact. Nothing that
# executes generated or third-party code runs with the credential in scope.

on:
  push:
    branches: [main]
    paths:
      - 'sdks/python/v1/**'
  # Re-run a publish without a new promotion (e.g. after fixing a
  # TestPyPI-side config problem).
  workflow_dispatch:

# One publish at a time. Two overlapping runs could race on the same version.
concurrency:
  group: publish-python-testpypi
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          # This job never pushes, so don't leave a credential in .git/config.
          # The default writes base64("x-access-token:<token>") into
          # http.extraheader — an unmasked live token readable by any build
          # tooling that runs afterwards. See the audit checklist, section 2.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The SDK is committed by the generate workflow, not built here. If it's
      # absent the promotion was made before the first sync PR merged, and
      # there is nothing to publish.
      - name: Verify the generated SDK is present
        run: |
          set -euo pipefail

          if [ ! -f sdks/python/v1/setup.py ] && [ ! -f sdks/python/v1/pyproject.toml ]; then
            echo "::error::No setup.py or pyproject.toml in sdks/python/v1."
            echo "::error::The generated SDK has not been committed yet; nothing to publish."
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build sdks/python/v1

      # Section 3 of the audit checklist requires enumerating a real artifact
      # rather than reasoning from config, and requires auditing the sdist and
      # the wheel separately — they're built by different code paths and
      # routinely disagree about what's excluded. Doing it here leaves a
      # permanent record on every release instead of relying on someone
      # repeating it by hand.
      - name: Enumerate artifact contents
        run: |
          set -euo pipefail

          cd sdks/python/v1/dist

          echo "## Published artifact contents" >> "$GITHUB_STEP_SUMMARY"

          for archive in *.tar.gz; do
            echo "### sdist: $archive" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tar tzf "$archive" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

          for archive in *.whl; do
            echo "### wheel: $archive" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            unzip -l "$archive" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      # Fails the release on the metadata defaults the audit flagged as publish
      # blockers (finding F6). `twine check` alone does not catch these — it
      # validates the long description renders, not that the author is real.
      - name: Check package metadata
        run: |
          set -euo pipefail

          pip install --upgrade twine
          twine check sdks/python/v1/dist/*

          metadata=$(python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("sdks/python/v1/dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as z:
              name = next(n for n in z.namelist() if n.endswith(".dist-info/METADATA"))
              sys.stdout.write(z.read(name).decode("utf-8", "replace"))
          PY
          )

          fail=0
          while IFS='|' read -r pattern message; do
            if printf '%s' "$metadata" | grep -qi "$pattern"; then
              echo "::error::$message"
              fail=1
            fi
          done <<'BLOCKERS'
          team@openapitools.org|Author email is the openapi-generator project's address, not ours (audit finding F6).
          OpenAPI Generator Community|Author is the generator's default, not ours. Set info.contact in mercury.json (audit finding F6).
          ^Version: 0\.0\.0|Version is still the 0.0.0 placeholder; the version-bump workflow did not run.
          BLOCKERS

          if [ "$fail" -ne 0 ]; then
            echo "::error::Refusing to publish with generated-default metadata. See docs/publish-leak-audit-checklist.md."
            exit 1
          fi

          echo "Package metadata checks passed."

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk-dist
          path: sdks/python/v1/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    # The Environment is what keeps the publish capability off arbitrary
    # branches, and is where a required reviewer can be attached if we ever
    # want a human gate before a release leaves the building.
    environment:
      name: testpypi
      url: https://test.pypi.org/project/mig-interactions-api/

    permissions:
      # Mints the short-lived OIDC token TestPyPI exchanges for an upload
      # grant. This is the only elevated permission in the file, and the job
      # holding it runs nothing but the download and the upload.
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: python-sdk-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Re-promoting develop -> main without a version change would
          # otherwise fail the release on a duplicate upload. Acceptable on a
          # test registry; set this to false for the PyPI switch in milestone 9,
          # where a silent skip would hide a real mistake.
          skip-existing: true
          print-hash: true
