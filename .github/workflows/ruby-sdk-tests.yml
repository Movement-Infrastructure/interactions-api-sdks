name: Ruby SDK tests

# On every PR to develop: regenerate sdks/ruby/v1/, install it, and run the
# suite in sdks/ruby/v1/spec/.
#
# No `paths:` filter, deliberately: a path-filtered required check shows as
# perpetually pending on PRs that don't match it, blocking merge forever.
# Branches with no committed spec skip the heavy steps and pass.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  ruby-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          # This job never pushes. The default leaves a live token in
          # .git/config as an http.extraheader, and this job runs
          # `bundle install`, which executes third-party gem code.
          persist-credentials: false
          # All branch refs, so the drift check below can diff against the base
          # branch without an authenticated fetch of its own.
          fetch-depth: 0

      - name: Check for committed OpenAPI spec
        id: spec
        run: |
          if [ -f openapi/v1/swagger.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No openapi/v1/swagger.json on this branch; the Ruby SDK cannot change without a spec, so smoke tests are skipped (pass)."
          fi

      - name: Set up Java
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache openapi-generator jar
        if: steps.spec.outputs.present == 'true'
        id: cache-generator
        uses: actions/cache@v4
        with:
          path: .cache/openapi-generator-cli.jar
          key: openapi-generator-7.10.0

      - name: Download openapi-generator jar
        if: steps.spec.outputs.present == 'true' && steps.cache-generator.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -sSL \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.10.0/openapi-generator-cli-7.10.0.jar \
            -o .cache/openapi-generator-cli.jar

      - name: Generate Ruby SDK
        if: steps.spec.outputs.present == 'true'
        run: |
          java -jar .cache/openapi-generator-cli.jar generate \
            -i openapi/v1/swagger.json \
            -g ruby \
            -o sdks/ruby/v1 \
            -c sdks/ruby/v1/openapi-generator-config.yaml \
            -t templates/ruby

      - name: Set up Python
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The same patch generate-ruby-sdk.yml applies, because this job
      # installs what it just regenerated. Keep the two copies in sync.
      - name: Patch generated gemspec file list
        if: steps.spec.outputs.present == 'true'
        run: |
          python - <<'PY'
          import pathlib, sys

          GEMSPEC = pathlib.Path("sdks/ruby/v1/ddx_interactions_api.gemspec")
          MARKER = 'Dir["lib/**/*"]'
          ANCHOR = (
              '  s.files         = `find *`.split("\\n").uniq.sort.select { |f| !f.empty? }\n'
              '  s.test_files    = `find spec/*`.split("\\n")\n'
          )
          REPLACEMENT = (
              '  # Ship the library and its README only. The generator globs the whole\n'
              '  # directory, which would publish docs/, spec/, the Gemfile, the Rakefile\n'
              '  # and the generator config inside the gem.\n'
              '  s.files         = Dir["lib/**/*"].select { |f| File.file?(f) } + ["README.md"]\n'
              '  s.test_files    = []\n'
          )

          text = GEMSPEC.read_text(encoding="utf-8")
          if MARKER in text:
              print("already applied: gemspec file list")
          else:
              hits = text.count(ANCHOR)
              if hits != 1:
                  sys.exit(
                      f"::error::{GEMSPEC}: file-list anchor matched {hits} times, "
                      f"expected 1. Generator template changed; update this step and "
                      f"its copy in generate-ruby-sdk.yml."
                  )
              GEMSPEC.write_text(text.replace(ANCHOR, REPLACEMENT), encoding="utf-8")
              print("patched: gemspec file list")
          PY

      # README.md ships inside the gem. A dropped `-t templates/ruby` would
      # silently restore the built-in template, which installs from a git URL.
      - name: Verify generated README
        if: steps.spec.outputs.present == 'true'
        run: python scripts/verify_readme.py sdks/ruby/v1/README.md --language ruby

      - name: Set up Ruby
        if: steps.spec.outputs.present == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install gem + test deps
        if: steps.spec.outputs.present == 'true'
        working-directory: sdks/ruby/v1
        run: bundle install

      - name: Run smoke tests
        if: steps.spec.outputs.present == 'true'
        working-directory: sdks/ruby/v1
        run: bundle exec rspec

      # The SDK is committed, so it can drift from the spec and the templates
      # with nothing noticing. This job has already regenerated it, so any
      # difference means the committed copy is stale. Last, so a drift failure
      # doesn't hide the test results. Skipped when the spec changed here,
      # because generate-ruby-sdk.yml commits the regenerated SDK on those PRs.
      #
      # `git status`, not `git diff`: a new model adds an untracked file, which
      # a diff does not report. Gemfile.lock is excluded because the
      # `bundle install` above adds the runner's platform to it, which is not
      # SDK drift.
      - name: Check the committed SDK is up to date
        if: steps.spec.outputs.present == 'true'
        run: |
          set -euo pipefail

          if ! git diff --quiet "origin/${{ github.base_ref }}" -- openapi/v1/swagger.json; then
            echo "::notice::Spec changed in this PR; the generate workflow commits the regenerated SDK."
            exit 0
          fi

          drift=$(git status --porcelain -- sdks/ruby/v1 ':!sdks/ruby/v1/Gemfile.lock')

          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::sdks/ruby/v1 does not match a fresh generation. Regenerate and commit it."
            exit 1
          fi
