name: Ruby SDK tests

# On every PR to develop, regenerate sdks/ruby/v1/ from openapi/v1/swagger.json,
# install it, and run the smoke + happy-path suite in sdks/ruby/v1/spec/.
#
# Runs on ALL PRs (no `paths:` filter) on purpose: a required status check that
# is path-filtered will show as perpetually pending on PRs that don't match the
# filter, blocking merge forever. Running unconditionally means the check always
# reports a result. If a branch has no committed spec yet, the SDK cannot be
# generated or affected, so the heavy steps are skipped and the job passes.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  ruby-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Check for committed OpenAPI spec
        id: spec
        run: |
          if [ -f openapi/v1/swagger.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No openapi/v1/swagger.json on this branch; the Ruby SDK cannot change without a spec, so smoke tests are skipped (pass)."
          fi

      - name: Set up Java
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache openapi-generator jar
        if: steps.spec.outputs.present == 'true'
        id: cache-generator
        uses: actions/cache@v4
        with:
          path: .cache/openapi-generator-cli.jar
          key: openapi-generator-7.10.0

      - name: Download openapi-generator jar
        if: steps.spec.outputs.present == 'true' && steps.cache-generator.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -sSL \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.10.0/openapi-generator-cli-7.10.0.jar \
            -o .cache/openapi-generator-cli.jar

      - name: Generate Ruby SDK
        if: steps.spec.outputs.present == 'true'
        run: |
          java -jar .cache/openapi-generator-cli.jar generate \
            -i openapi/v1/swagger.json \
            -g ruby \
            -o sdks/ruby/v1 \
            -c sdks/ruby/v1/openapi-generator-config.yaml

      - name: Set up Python
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Same patch generate-ruby-sdk.yml applies, because this job installs what
      # it just regenerated -- without it CI would test a gem whose file list
      # still globs the whole directory. Keep the two copies in sync.
      - name: Patch generated gemspec file list
        if: steps.spec.outputs.present == 'true'
        run: |
          python - <<'PY'
          import pathlib, sys

          GEMSPEC = pathlib.Path("sdks/ruby/v1/ddx_interactions_api.gemspec")
          MARKER = 'Dir["lib/**/*"]'
          ANCHOR = (
              '  s.files         = `find *`.split("\\n").uniq.sort.select { |f| !f.empty? }\n'
              '  s.test_files    = `find spec/*`.split("\\n")\n'
          )
          REPLACEMENT = (
              '  # Ship the library and its README only. The generator globs the whole\n'
              '  # directory, which would publish docs/, spec/, the Gemfile, the Rakefile\n'
              '  # and the generator config inside the gem.\n'
              '  s.files         = Dir["lib/**/*"].select { |f| File.file?(f) } + ["README.md"]\n'
              '  s.test_files    = []\n'
          )

          text = GEMSPEC.read_text(encoding="utf-8")
          if MARKER in text:
              print("already applied: gemspec file list")
          else:
              hits = text.count(ANCHOR)
              if hits != 1:
                  sys.exit(
                      f"::error::{GEMSPEC}: file-list anchor matched {hits} times, "
                      f"expected 1. Generator template changed; update this step and "
                      f"its copy in generate-ruby-sdk.yml."
                  )
              GEMSPEC.write_text(text.replace(ANCHOR, REPLACEMENT), encoding="utf-8")
              print("patched: gemspec file list")
          PY

      - name: Set up Ruby
        if: steps.spec.outputs.present == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install gem + test deps
        if: steps.spec.outputs.present == 'true'
        working-directory: sdks/ruby/v1
        run: bundle install

      - name: Run smoke tests
        if: steps.spec.outputs.present == 'true'
        working-directory: sdks/ruby/v1
        run: bundle exec rspec
