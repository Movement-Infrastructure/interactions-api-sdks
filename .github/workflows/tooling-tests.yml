name: Tooling tests

# Unit tests for the tooling under scripts/. Separate from python-sdk-tests.yml
# because this suite needs neither the spec nor the generator, so it stays green
# during the bootstrap window before a spec is committed.
#
# No `paths:` filter, for the same reason as python-sdk-tests.yml: a
# path-filtered required check shows as perpetually pending on PRs that don't
# match, blocking merge forever.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-test.txt

      - name: Run tooling tests
        run: pytest scripts/tests -q
