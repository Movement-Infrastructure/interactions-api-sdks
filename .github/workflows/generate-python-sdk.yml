name: Generate Python SDK

# On every PR that touches openapi/v1/swagger.json, computes the next package
# version from the PR's labels, regenerates sdks/python/v1/, and commits both
# back to the PR branch so the version lands in the generated manifest.

on:
  pull_request:
    # `labeled`/`unlabeled` are here so adding or removing a version label
    # after the PR opens recomputes the version.
    types: [opened, synchronize, labeled, unlabeled]
    paths:
      - openapi/v1/swagger.json

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # Use a PAT so the push back to the PR branch triggers downstream
          # checks. The default GITHUB_TOKEN push is silently ignored by GHA
          # for push-triggered workflows on the same branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read base-branch package version
        run: |
          set -euo pipefail

          config=sdks/python/v1/openapi-generator-config.yaml

          git fetch --depth=1 origin "${{ github.base_ref }}"

          if ! git show "FETCH_HEAD:$config" > /tmp/base-config.yaml; then
            echo "::error::$config not found on ${{ github.base_ref }}; cannot determine the current version."
            exit 1
          fi

      - name: Compute and apply next version
        id: version
        run: |
          python scripts/bump_version.py \
            --current-config /tmp/base-config.yaml \
            --write-config sdks/python/v1/openapi-generator-config.yaml \
            --labels-json '${{ toJSON(github.event.pull_request.labels.*.name) }}'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache openapi-generator jar
        id: cache-generator
        uses: actions/cache@v4
        with:
          path: .cache/openapi-generator-cli.jar
          key: openapi-generator-7.10.0

      - name: Download openapi-generator jar
        if: steps.cache-generator.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -sSL \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.10.0/openapi-generator-cli-7.10.0.jar \
            -o .cache/openapi-generator-cli.jar

      - name: Generate Python SDK
        run: |
          java -jar .cache/openapi-generator-cli.jar generate \
            -i openapi/v1/swagger.json \
            -g python \
            -o sdks/python/v1 \
            -c sdks/python/v1/openapi-generator-config.yaml

      # openapi-generator's Python template drops three things setup() needs, and
      # no generator config option controls any of them:
      #
      #   - PYTHON_REQUIRES is defined and never passed, so no Requires-Python.
      #   - No certifi, and ssl_ca_cert defaults to None, so HTTPS dies with
      #     CERTIFICATE_VERIFY_FAILED on python.org macOS builds, whose OpenSSL
      #     trust store is empty. urllib3 2.x will not pick up certifi on its own.
      #   - info.license reaches pyproject.toml's poetry table, which the
      #     setuptools backend ignores, and never reaches setup().
      #
      # Anchors are exact generated text and a miss is fatal, so a template change
      # fails the build instead of silently publishing a package missing these.
      # Keep in sync with the copy in python-sdk-tests.yml. See MIG-2365.
      - name: Patch generated SDK metadata
        run: |
          python - <<'PY'
          import pathlib, re, sys

          ROOT = pathlib.Path("sdks/python/v1")
          CERTIFI = "certifi >= 2024.2.2"

          # Read the license back out of pyproject.toml so the spec's info.license
          # stays the single source of truth rather than being hardcoded here.
          lic = re.search(
              r'^license = "(.+)"$',
              (ROOT / "pyproject.toml").read_text(encoding="utf-8"),
              re.M,
          )
          if not lic or lic.group(1) == "NoLicense":
              sys.exit(
                  "::error::pyproject.toml carries no usable license. Set License on "
                  "the OpenApiInfo in minerva's Mercury.Api/"
                  "MercuryApiServiceCollectionExtensions.cs, then let it regenerate "
                  "into mig-readme-docs and sync here. Editing reference/mercury.json "
                  "by hand does not survive the next Swagger regeneration."
              )

          # (file, anchor, replacement, already-applied marker)
          PATCHES = [
              ("setup.py",
               "    install_requires=REQUIRES,\n",
               "    python_requires=PYTHON_REQUIRES,\n    install_requires=REQUIRES,\n",
               "python_requires=PYTHON_REQUIRES"),
              ("setup.py",
               '    "typing-extensions >= 4.7.1",\n]',
               f'    "typing-extensions >= 4.7.1",\n    "{CERTIFI}",\n]',
               CERTIFI),
              ("setup.py",
               '    packages=find_packages(exclude=["test", "tests"]),\n',
               f'    license="{lic.group(1)}",\n    packages=find_packages(exclude=["test", "tests"]),\n',
               'license="'),
              ("ddx_interactions_api/configuration.py",
               "        self.ssl_ca_cert = ssl_ca_cert\n",
               "        import certifi\n"
               "        self.ssl_ca_cert = ssl_ca_cert if ssl_ca_cert is not None else certifi.where()\n",
               "certifi.where()"),
          ]

          for name, anchor, replacement, marker in PATCHES:
              path = ROOT / name
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  print(f"already applied: {name}")
                  continue
              found = text.count(anchor)
              if found != 1:
                  sys.exit(
                      f"::error::{path}: anchor {anchor!r} matched {found} times, "
                      f"expected 1. Generator template changed; update this step "
                      f"and its copy in python-sdk-tests.yml."
                  )
              path.write_text(text.replace(anchor, replacement), encoding="utf-8")
              print(f"patched: {name}")
          PY

      - name: Commit generated SDK if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sdks/python/v1

          if git diff --cached --quiet; then
            echo "No changes to generated SDK — skipping commit."
          else
            git commit -m "chore: regenerate Python SDK at v${{ steps.version.outputs.next }} from openapi/v1/swagger.json"
            git push origin HEAD:${{ github.head_ref }}
          fi
