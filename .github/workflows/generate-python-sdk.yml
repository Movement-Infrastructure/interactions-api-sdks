name: Generate Python SDK

# On every PR that touches openapi/v1/swagger.json, computes the next package
# version from the PR's labels, regenerates sdks/python/v1/, and commits both
# back to the PR branch so the version lands in the generated manifest.

on:
  pull_request:
    # `labeled`/`unlabeled` are here so adding or removing a version label
    # after the PR opens recomputes the version.
    types: [opened, synchronize, labeled, unlabeled]
    paths:
      - openapi/v1/swagger.json

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          # Use a PAT so the push back to the PR branch triggers downstream
          # checks. The default GITHUB_TOKEN push is silently ignored by GHA
          # for push-triggered workflows on the same branch.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # One fetch serves three steps: the version bump reads the base config,
      # and the changelog reads the base spec and the base changelog.
      - name: Read base-branch package version
        id: base
        run: |
          set -euo pipefail

          config=sdks/python/v1/openapi-generator-config.yaml

          git fetch --depth=1 origin "${{ github.base_ref }}"

          if ! git show "FETCH_HEAD:$config" > /tmp/base-config.yaml; then
            echo "::error::$config not found on ${{ github.base_ref }}; cannot determine the current version."
            exit 1
          fi

          # Absent on the bootstrap sync that commits the first spec. No
          # baseline means nothing to diff, so the changelog steps below are
          # skipped rather than failing the run.
          if git show "FETCH_HEAD:openapi/v1/swagger.json" > /tmp/base-swagger.json 2>/dev/null; then
            echo "has_spec=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_spec=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No spec on ${{ github.base_ref }}; skipping the changelog."
          fi

          # Absent until the first sync after this workflow ships, which is the
          # case the renderer treats as creating the file.
          git show "FETCH_HEAD:sdks/python/v1/CHANGELOG.md" > /tmp/base-changelog.md 2>/dev/null \
            || echo "::notice::No changelog on ${{ github.base_ref }} yet; it will be created."

      - name: Compute and apply next version
        id: version
        run: |
          python scripts/bump_version.py \
            --current-config /tmp/base-config.yaml \
            --write-config sdks/python/v1/openapi-generator-config.yaml \
            --labels-json '${{ toJSON(github.event.pull_request.labels.*.name) }}'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache openapi-generator jar
        id: cache-generator
        uses: actions/cache@v4
        with:
          path: .cache/openapi-generator-cli.jar
          key: openapi-generator-7.10.0

      - name: Download openapi-generator jar
        if: steps.cache-generator.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -sSL \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.10.0/openapi-generator-cli-7.10.0.jar \
            -o .cache/openapi-generator-cli.jar

      - name: Generate Python SDK
        run: |
          java -jar .cache/openapi-generator-cli.jar generate \
            -i openapi/v1/swagger.json \
            -g python \
            -o sdks/python/v1 \
            -c sdks/python/v1/openapi-generator-config.yaml \
            -t templates/python

      # Fills in what the python generator hardcodes or omits: python_requires,
      # certifi, the Changelog project URL, and long_description (which PyPI
      # renders as the whole project page). Shared with python-sdk-tests.yml
      # rather than duplicated, and unit-tested by tooling-tests.yml.
      - name: Patch generated SDK metadata
        run: python scripts/patch_python_sdk.py sdks/python/v1

      # Pinned like the openapi-generator jar, so a sync PR's changelog can't
      # change wording because upstream shipped a release.
      - name: Install oasdiff
        if: steps.base.outputs.has_spec == 'true'
        env:
          OASDIFF_VERSION: 1.30.0
        run: |
          set -euo pipefail

          curl -sSL \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin oasdiff

          oasdiff --version

      # JSON rather than oasdiff's markdown: its markdown heads the output with
      # `API Changelog v1 vs. v1` (the cutover guard already enforces matching
      # info.version) and repeats each schema change once per request media
      # type. scripts/render_changelog.py collapses that and files the entry
      # under the version computed above.
      - name: Update CHANGELOG.md
        if: steps.base.outputs.has_spec == 'true'
        run: |
          set -euo pipefail

          oasdiff changelog /tmp/base-swagger.json openapi/v1/swagger.json \
            -f json > /tmp/oasdiff.json

          python scripts/render_changelog.py \
            --oasdiff-json /tmp/oasdiff.json \
            --version "${{ steps.version.outputs.next }}" \
            --date "$(date -u +%Y-%m-%d)" \
            --current-changelog /tmp/base-changelog.md \
            --write-changelog sdks/python/v1/CHANGELOG.md

      - name: Commit generated SDK if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sdks/python/v1

          if git diff --cached --quiet; then
            echo "No changes to generated SDK — skipping commit."
          else
            git commit -m "chore: regenerate Python SDK at v${{ steps.version.outputs.next }} from openapi/v1/swagger.json"
            git push origin HEAD:${{ github.head_ref }}
          fi
