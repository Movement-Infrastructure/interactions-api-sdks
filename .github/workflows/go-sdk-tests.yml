name: Go SDK tests

# On every PR to develop, regenerate sdks/go/ from openapi/v1/swagger.json,
# vet it, and run the smoke + happy-path suite in sdks/go/test/.
#
# No `paths:` filter, deliberately: a path-filtered required check shows as
# perpetually pending on PRs that don't match it, blocking merge forever.
# Branches with no committed spec skip the heavy steps and pass.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  go-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `go.mod` tests the floor in the go directive and follows it when it
        # changes. `stable` is the current release.
        go: ['go.mod', 'stable']

    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Check for committed OpenAPI spec
        id: spec
        run: |
          if [ -f openapi/v1/swagger.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No openapi/v1/swagger.json on this branch; the Go SDK cannot change without a spec, so smoke tests are skipped (pass)."
          fi

      - name: Set up Java
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache openapi-generator jar
        if: steps.spec.outputs.present == 'true'
        id: cache-generator
        uses: actions/cache@v4
        with:
          path: .cache/openapi-generator-cli.jar
          key: openapi-generator-7.10.0

      - name: Download openapi-generator jar
        if: steps.spec.outputs.present == 'true' && steps.cache-generator.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -sSL \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.10.0/openapi-generator-cli-7.10.0.jar \
            -o .cache/openapi-generator-cli.jar

      - name: Generate Go SDK
        if: steps.spec.outputs.present == 'true'
        run: |
          java -jar .cache/openapi-generator-cli.jar generate \
            -i openapi/v1/swagger.json \
            -g go \
            -o sdks/go \
            -c sdks/go/openapi-generator-config.yaml \
            -t templates/go

      - name: Set up Go
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
          go-version-file: ${{ matrix.go == 'go.mod' && 'sdks/go/go.mod' || '' }}
          cache-dependency-path: sdks/go/go.sum

      # The formatting generate-go-sdk.yml applies. The drift check below
      # compares against a formatted copy.
      - name: Format generated SDK
        if: steps.spec.outputs.present == 'true'
        working-directory: sdks/go
        run: |
          set -euo pipefail

          gofmt -w .
          gofmt -w .

          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            echo "::error::gofmt did not converge in two passes."
            exit 1
          fi

      - name: Set up Python
        if: steps.spec.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A dropped `-t templates/go` would silently restore the built-in
      # template, which tells consumers to copy the package into their tree.
      - name: Verify generated README
        if: steps.spec.outputs.present == 'true'
        run: python scripts/verify_readme.py sdks/go/README.md --language go

      # pkg.go.dev renders documentation only for a module with a license. The
      # module zip holds sdks/go alone and leaves out the repo's root LICENSE.
      - name: Check the module license matches the repo's
        if: steps.spec.outputs.present == 'true'
        run: |
          if ! cmp -s LICENSE sdks/go/LICENSE; then
            echo "::error::sdks/go/LICENSE differs from LICENSE. Copy the root file over it."
            exit 1
          fi

      # go.sum.mustache hardcodes what `go mod tidy` writes. If the two
      # disagree, consumers would hit a checksum mismatch on install.
      - name: Check go.mod and go.sum are tidy
        if: steps.spec.outputs.present == 'true'
        working-directory: sdks/go
        run: |
          set -euo pipefail

          cp go.mod go.sum "$RUNNER_TEMP/"
          go mod tidy

          if ! cmp -s go.mod "$RUNNER_TEMP/go.mod" || ! cmp -s go.sum "$RUNNER_TEMP/go.sum"; then
            git diff -- go.mod go.sum
            echo "::error::go mod tidy changed go.mod or go.sum. Update templates/go/go.mod.mustache and go.sum.mustache to match."
            exit 1
          fi

      - name: Vet
        if: steps.spec.outputs.present == 'true'
        working-directory: sdks/go
        run: go vet ./...

      - name: Run smoke tests
        if: steps.spec.outputs.present == 'true'
        working-directory: sdks/go
        run: go test ./...

      # This job already regenerated the SDK, so any difference means the
      # committed copy is stale. Placed last so a drift failure does not hide
      # the test results. Skipped when the spec changed here, because
      # generate-go-sdk.yml commits the regenerated SDK on those PRs.
      #
      # `git status`, not `git diff`: a new model adds an untracked file, which
      # a diff does not report.
      - name: Check the committed SDK is up to date
        if: steps.spec.outputs.present == 'true'
        run: |
          set -euo pipefail

          # The shallow PR checkout has no origin/<base>. Diffing a missing ref
          # fails, and the `!` would read that as "spec changed" and skip.
          git fetch --depth=1 origin "${{ github.base_ref }}"

          if ! git diff --quiet FETCH_HEAD -- openapi/v1/swagger.json; then
            echo "::notice::Spec changed in this PR; the generate workflow commits the regenerated SDK."
            exit 0
          fi

          drift=$(git status --porcelain -- sdks/go)

          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::error::sdks/go does not match a fresh generation. Regenerate and commit it."
            exit 1
          fi
