name: Sync OpenAPI spec from mig-readme-docs

# MIG-1916. Pulls reference/mercury.json from mig-readme-docs, compares against
# the committed openapi/v1/swagger.json, and (in later stages) opens a PR if
# they differ.
#
# Stage 1 (auth verification) and stage 2 (diff detection) are in place.
# Stages 3 (PR opening) and 4 (schedule) are pending. See the plan file:
# Plans/MIG-1916-scheduled-spec-sync.md.
#
# This file is named sync-spec-verify.yml during development; will be renamed
# to sync-spec.yml at stage 4 cleanup.

on:
  workflow_dispatch:
  # TEMP: remove in stage 4 cleanup. Lets us iterate on the workflow without
  # needing it on the default branch for workflow_dispatch to register.
  push:
    branches:
      - sam/mig-1916-scheduled-spec-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # bumped to `write` in stage 3 for branch push
    steps:
      - name: Check out SDK repo
        uses: actions/checkout@v4

      - name: Mint installation token for mig-readme-docs
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.READMEDOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.READMEDOCS_SYNC_PRIVATE_KEY }}
          owner: Movement-Infrastructure
          repositories: mig-readme-docs

      - name: Fetch reference/mercury.json from mig-readme-docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          response=$(gh api \
            -H "Accept: application/vnd.github+json" \
            repos/Movement-Infrastructure/mig-readme-docs/contents/reference/mercury.json)

          echo "$response" | jq -r '.content' | base64 -d > upstream-mercury.json

          blob_sha=$(echo "$response" | jq -r '.sha')
          size=$(echo "$response" | jq -r '.size')

          echo "Upstream blob SHA: $blob_sha"
          echo "Size (bytes): $size"
          echo "openapi version: $(jq -r '.openapi // "(missing)"' upstream-mercury.json)"
          echo "info.title: $(jq -r '.info.title // "(missing)"' upstream-mercury.json)"

      - name: Compare against committed openapi/v1/swagger.json
        id: diff
        run: |
          set -euo pipefail

          local_path=openapi/v1/swagger.json

          if [ ! -f "$local_path" ]; then
            echo "No local spec at $local_path; treating as initial-bootstrap diff."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=bootstrap" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if cmp -s upstream-mercury.json "$local_path"; then
            echo "No change vs committed spec."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream spec differs from committed spec."
            diff -u "$local_path" upstream-mercury.json | head -40 || true
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=upstream-changed" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          echo "changed=${{ steps.diff.outputs.changed }}"
          echo "reason=${{ steps.diff.outputs.reason }}"
