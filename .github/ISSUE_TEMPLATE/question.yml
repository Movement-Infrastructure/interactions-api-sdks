name: Question about using an SDK
description: How to do something with a generated SDK.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions about API access, API keys, or your Destinations are answered by
        email at <api@demexchange.com> rather than here.

        **Do not paste an API key.** Replace it with `REDACTED` before you submit.
        This repository is public.

  - type: input
    id: sdk
    attributes:
      label: Which SDK
      description: The package name you installed, or "any" if this is not specific to one.
    validations:
      required: true

  - type: input
    id: sdk-version
    attributes:
      label: SDK version
      placeholder: "0.2.0"

  - type: textarea
    id: question
    attributes:
      label: What are you trying to do
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you have tried so far
      description: Code, with the API key redacted, plus anything you already read.
      render: text

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I removed API keys, and any data belonging to real people, from everything above.
          required: true
